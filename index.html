<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Human Typist Controller</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0b0b;
            color: #f1f1f1;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: #141414;
            border: 1px solid #222;
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        p.subtitle {
            color: #777;
            font-size: 0.95rem;
            margin-bottom: 30px;
        }

        .status-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #1a1a1a;
            padding: 14px 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            border: 1px solid #2a2a2a;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            color: #aaa;
        }

        .dot {
            width: 10px;
            height: 10px;
            background-color: #ff4d4d;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(255, 77, 77, 0.4);
            transition: all 0.3s ease;
        }

        .dot.connected {
            background-color: #2ecc71;
            box-shadow: 0 0 8px rgba(46, 204, 113, 0.6);
        }

        button {
            background-color: #262626;
            color: #fff;
            border: 1px solid #3b3b3b;
            padding: 10px 18px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }

        button:hover:not(:disabled) {
            background-color: #333;
            border-color: #555;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .input-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: #ccc;
            letter-spacing: 0.3px;
        }

        textarea {
            width: 100%;
            height: 220px;
            background-color: #0e0e0e;
            border: 1px solid #262626;
            border-radius: 8px;
            color: #f1f1f1;
            padding: 16px;
            font-size: 1rem;
            font-family: inherit;
            resize: vertical;
            line-height: 1.5;
            transition: border-color 0.2s;
        }

        textarea:focus {
            outline: none;
            border-color: #4f46e5;
        }

        .save-btn {
            width: 100%;
            background-color: #4f46e5;
            border-color: #4f46e5;
            color: white;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .save-btn:hover:not(:disabled) {
            background-color: #4338ca;
        }

        #feedback {
            margin-top: 15px;
            text-align: center;
            font-size: 0.85rem;
            color: #2ecc71;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>ESP32 Human Typist</h1>
        <p class="subtitle">Configure what text your hardware types out when you press the button on Pin 8.</p>

        <div class="status-box">
            <div class="status-indicator">
                <div id="statusDot" class="dot"></div>
                <span id="statusText">Disconnected</span>
            </div>
            <button id="connectBtn" onclick="toggleConnect()">Connect Device</button>
        </div>

        <div class="input-group">
            <label for="textInput">Text to Type (Supports multiple lines)</label>
            <textarea id="textInput" placeholder="hello&#10;rs"></textarea>
        </div>

        <button id="saveBtn" class="save-btn" onclick="sendText()" disabled>Save to ESP32</button>
        <div id="feedback"></div>
    </div>

    <script>
        let port;
        let writer;
        const connectBtn = document.getElementById('connectBtn');
        const saveBtn = document.getElementById('saveBtn');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const textInput = document.getElementById('textInput');
        const feedback = document.getElementById('feedback');

        async function toggleConnect() {
            if (port) {
                try {
                    if (writer) {
                        await writer.close();
                    }
                    await port.close();
                } catch (err) {
                    console.error(err);
                }
                port = null;
                writer = null;
                updateUI(false);
            } else {
                try {
                    port = await navigator.serial.requestPort();
                    await port.open({ baudRate: 115200 });
                    
                    const textEncoder = new TextEncoderStream();
                    textEncoder.readable.pipeTo(port.writable);
                    writer = textEncoder.writable.getWriter();

                    updateUI(true);
                } catch (err) {
                    console.error("Connection failed:", err);
                    alert("Could not connect to the device. Make sure the correct port is selected.");
                }
            }
        }

        function updateUI(isConnected) {
            if (isConnected) {
                statusDot.classList.add('connected');
                statusText.textContent = 'Connected';
                connectBtn.textContent = 'Disconnect';
                saveBtn.disabled = false;
            } else {
                statusDot.classList.remove('connected');
                statusText.textContent = 'Disconnected';
                connectBtn.textContent = 'Connect Device';
                saveBtn.disabled = true;
            }
        }

        async function sendText() {
            if (!writer) return;

            const textToSend = textInput.value;
            try {
                // Send multi-line text followed by the custom end marker
                await writer.write(textToSend + "###END###");
                feedback.textContent = "Successfully saved! LED should flash purple.";
                setTimeout(() => { feedback.textContent = ""; }, 4000);
            } catch (err) {
                console.error("Error sending data:", err);
                feedback.style.color = "#ff4d4d";
                feedback.textContent = "Error saving text. Try reconnecting.";
                setTimeout(() => { feedback.textContent = ""; feedback.style.color = "#2ecc71"; }, 4000);
            }
        }
    </script>
</body>
</html>
